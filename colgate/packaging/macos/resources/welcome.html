<p style="margin-top: 2px; color: #666;">by Hiccup Audio</p>
<p>This installs Colgate, a perceptual equaliser that uncovers what is hidden in your sound, as an Audio Unit and a VST3 plug-in.</p>
<p>All versions run natively on Apple silicon and Intel Macs. Your host may need to rescan its plug-ins before Colgate appears.</p>
